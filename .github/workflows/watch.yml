name: Speaker watch

on:
  schedule:
    - cron: "*/15 * * * *"   # quick: HiFi Shark (eBay UK) + eBay API
    - cron: "7 */3 * * *"    # full: every site the cloud can reach
  workflow_dispatch:
    inputs:
      sources:
        description: "Sites to check (blank = all except Facebook), e.g. 'hifishark gumtree' or 'facebook'"
        required: false
        default: ""

# one run at a time; queued runs wait so seen.json is never written twice at once
concurrency:
  group: speaker-watch
  cancel-in-progress: false

permissions:
  contents: write   # to save seen.json / listings.html back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check sites
        env:
          WATCH_DATA_DIR: data
          # these block GitHub's servers, so the Mac checks them
          MAC_ONLY: facebook petertyson_clearance quantumav quantumav_clearance
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.sources }}" ]; then ARGS="--only ${{ inputs.sources }}"; else ARGS="--skip $MAC_ONLY"; fi
          elif [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            ARGS="--only hifishark ebay"
          else
            ARGS="--skip $MAC_ONLY"
          fi
          echo "python watch.py $ARGS"
          python watch.py $ARGS

      - name: Save results
        if: always()
        run: |
          git config user.name "speaker-watch"
          git config user.email "speaker-watch@users.noreply.github.com"
          cp data/seen.json "$RUNNER_TEMP/seen.json"; cp data/watch.log "$RUNNER_TEMP/watch.log" 2>/dev/null || touch "$RUNNER_TEMP/watch.log"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python merge_state.py "$RUNNER_TEMP/seen.json" "$RUNNER_TEMP/watch.log"
            git add data/seen.json data/listings.html data/watch.log
            git diff --cached --quiet && break
            git commit -q -m "Update listings" && git push -q origin HEAD:main && break
            sleep $((attempt * 5))
          done
